# Publicação do backend no Render (https://render.com).
# No painel: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: linsolve-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/
    envVars:
      # Endereço público do frontend (ex.: https://linsolve.vercel.app).
      # O Render pede o valor na criação do serviço.
      - key: CORS_ORIGINS
        sync: false
